# Render blueprint: Render reads this file to create the web service.
# Guide: DEPLOY.md
services:
  - type: web
    name: watch-together
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Your MongoDB Atlas connection string; Render asks for it on first deploy
      - key: MONGO_URI
        sync: false
      # Random secrets generated by Render; never put them in the code
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
